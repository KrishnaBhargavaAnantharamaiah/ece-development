<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Evolutionary Computation Enterprises</title>
  <desc id="desc">Evolutionary Computation Enterprises company logo with a blue and purple triangular mark.</desc>
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0077ff"/>
      <stop offset="0.5" stop-color="#16bfff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#b58cff"/>
      <stop offset="1" stop-color="#7a00ff"/>
    </linearGradient>
    <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008cff"/>
      <stop offset="1" stop-color="#8d19ff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="#ffffff"/>
  <g transform="translate(360 12)">
    <path d="M0 0 L-150 270 L0 255 Z" fill="url(#logoGradient)" stroke="url(#edgeGradient)" stroke-width="2"/>
    <path d="M0 0 L150 270 L0 255 Z" fill="url(#logoGradient)" stroke="url(#edgeGradient)" stroke-width="2"/>
    <path d="M0 0 L0 255" stroke="#ffffff" stroke-width="7" opacity="0.95"/>
    <path d="M-3 25 L-132 252" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
    <path d="M3 25 L132 252" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  </g>
  <g text-anchor="middle" fill="#030914" font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="3">
    <text x="360" y="330" font-size="47">EVOLUTIONARY</text>
    <text x="360" y="375" font-size="47">COMPUTATION</text>
    <text x="360" y="408" font-size="25" letter-spacing="8">ENTERPRISES</text>
  </g>
</svg>
